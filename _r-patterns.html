<!DOCTYPE html>
<html lang="ko"><head><meta charset="UTF-8"><title>route harness</title></head>
<body>
<script src="js/data.js"></script>
<script src="js/store.js"></script>
<script>
  // 파일명으로 라우트 결정: _r-recommend.html → route=recommend
  const m = /_r-([a-z-]+)\.html$/.exec(location.pathname);
  const route = m ? m[1] : 'home';
  try { localStorage.setItem('hhc.route', route); } catch (e) {}
  location.replace('index.html');
</script>
</body></html>
